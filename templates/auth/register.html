<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | FleetFlow</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo/logo.png') }}">
    <style>
        body {
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px 20px;
        }

        .register-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: var(--radius-xl);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 480px;
            padding: 36px;
            position: relative;
        }

        .home-nav-btn {
            position: absolute;
            top: 24px;
            left: 24px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-muted);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 9999px;
            background: #f1f5f9;
            transition: all 0.2s;
        }

        .home-nav-btn:hover {
            background: #e2e8f0;
            color: var(--text-main);
            transform: translateX(-2px);
        }
    </style>
</head>

<body>
    <div class="register-card">
        <a href="{{ url_for('home') }}" class="home-nav-btn">
            <i class="fas fa-arrow-left"></i> Home
        </a>

        <div style="text-align: center; margin-bottom: 24px; margin-top: 16px;">
            <div class="logo-badge" style="margin: 0 auto 12px auto; width: 46px; height: 46px; font-size: 22px;">
                <i class="fas fa-cubes"></i>
            </div>
            <h2 style="font-size: 22px; font-weight: 800; color: var(--text-main);">Create Account</h2>
            <p style="font-size: 13px; color: var(--text-muted);">Join FleetFlow Logistics Hub</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div
            style="padding: 10px 14px; border-radius: 8px; font-size: 12.5px; margin-bottom: 16px; background: {% if category=='danger' %}#fef2f2; color: #991b1b; border: 1px solid #fecaca;{% else %}#ecfdf5; color: #065f46; border: 1px solid #a7f3d0;{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label class="form-label"><i class="fas fa-user"></i> Full Name</label>
                <input type="text" name="name" class="form-control" placeholder="e.g. John Doe" required>
            </div>

            <div class="form-group">
                <label class="form-label"><i class="fas fa-envelope"></i> Work Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="name@fleetflow.com" required>
            </div>

            <div class="form-group">
                <label class="form-label"><i class="fas fa-id-badge"></i> Assigned System Role</label>
                <select name="role" class="form-select" required style="width: 100%;">
                    <option value="Manager">Fleet Manager (Full Asset & Ops Control)</option>
                    <option value="Dispatcher">Dispatcher (Trips & Route Assignments)</option>
                    <option value="Safety Officer">Safety Officer (Driver HR & Compliance)</option>
                    <option value="Financial Analyst">Financial Analyst (Accounting & ROI Audits)</option>
                </select>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Min 6 chars" required>
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-shield-alt"></i> Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control" placeholder="Repeat password"
                        required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary"
                style="width: 100%; padding: 11px; font-size: 14px; margin-top: 8px;">
                <i class="fas fa-user-check"></i> Register & Access Dashboard
            </button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted);">
            Already have an account?
            <a href="{{ url_for('login') }}"
                style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign In here</a>
        </div>
    </div>
</body>

</html>
